# Kitty Configuration File for macOS

# -----------------------------------------------------------------------------
# Font Settings
# -----------------------------------------------------------------------------
# Set the primary font to GohuFont Nerd Font and its size.
# Ensure this font is installed on your macOS system.
font_family                 GohuFont uni14 Nerd Font Mono
font_size                   12.0

# You can also specify bold, italic, and bold_italic fonts if they are different
# from the main font family. If not specified, Kitty will try to synthesize them.
# bold_font                   auto
# italic_font                 auto
# bold_italic_font            auto

# -----------------------------------------------------------------------------
# Visuals and Appearance
# -----------------------------------------------------------------------------
# Gruvbox color scheme.
# These colors are for the default Gruvbox theme (dark, hard).
# You can find other Gruvbox variants online if you prefer.
foreground                  #ebdbb2
background                  #1d2021
cursor                      #fabd2f
cursor_text_color           #282828

# Black
color0                      #282828
color8                      #928374

# Red
color1                      #cc241d
color9                      #fb4934

# Green
color2                      #98971a
color10                     #b8bb26

# Yellow
color3                      #d79921
color11                     #fabd2f

# Blue
color4                      #458588
color12                     #83a598

# Magenta
color5                      #b16286
color13                     #d3869b

# Cyan
color6                      #689d6a
color14                     #8ec07c

# White
color7                      #a89984
color15                     #ebdbb2

# Window transparency (opacity). 0.0 is fully transparent, 1.0 is fully opaque.
# You specified 0.8 for transparency.
background_opacity          0.8

# Remove the scrollbar.
hide_window_decorations     titlebar-only # Hide titlebar, but keep window controls (close, minimize, maximize)
                                          # Or use 'yes' to hide all decorations including window controls.
                                          # Or 'no' to keep them.
# Number of lines to keep in scrollback buffer
scrollback_lines            2000
scrollbar_marks             no            # Do not show marks on the scrollbar
scrollbar_position          no            # Do not show the scrollbar

# -----------------------------------------------------------------------------
# Copy/Paste & Mouse Selection
# -----------------------------------------------------------------------------
# Kitty uses standard macOS keybindings for copy/paste by default.
# No explicit configuration is usually needed for Cmd+C and Cmd+V.
# However, if you've had issues, ensure these are not rebound.
# These are the default bindings and should work out of the box.
# map cmd+c copy_to_clipboard
# map cmd+v paste_from_clipboard

# Mouse selection is also enabled by default.
# You can select text by dragging the mouse.
# To copy on selection, enable select_to_clipboard.
# select_to_clipboard       no # Set to 'yes' if you want selection to automatically copy to clipboard

# -----------------------------------------------------------------------------
# Image Viewing
# -----------------------------------------------------------------------------
# Kitty supports displaying images directly in the terminal using the `icat` command.
# This requires `imagemagick` to be installed on your system (macOS).
# You can install it via Homebrew: `brew install imagemagick`
# Then, you can use `icat image.jpg` to view images.
# No specific config option is needed in kitty.conf for this, it's a feature of Kitty itself
# and relies on external tools like imagemagick for image processing.

# -----------------------------------------------------------------------------
# Keybindings
# -----------------------------------------------------------------------------
# Custom key shortcut to enter and exit full screen mode.
map cmd+f toggle_fullscreen

# Hide the entire window decoration (title bar and window controls)
hide_window_decorations     yes

# Set default window size for new terminals
initial_window_width  800
initial_window_height 450
remember_window_size  no
